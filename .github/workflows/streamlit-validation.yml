name: Streamlit Application Validation

'on':
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "published-models/**"
      - "requirements.txt"
      - "tests/**"
      - ".streamlit/**"
      - ".github/workflows/streamlit-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-streamlit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run application tests
        run: |
          python -m pytest tests/ -q

      - name: Validate Streamlit source
        run: |
          python -m py_compile app/streamlit_app.py

      - name: Streamlit application smoke test
        run: |
          python -m streamlit run app/streamlit_app.py \
            --server.headless=true \
            --server.port=8501 > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:8501/_stcore/health"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      url, timeout=3
                  ) as response:
                      if response.status == 200:
                          print("Streamlit health check passed.")
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit(
                  "Streamlit health check failed."
              )
          PY
